<h1>P2P Chess distribution</h1>
<p>P2P Chess アプリが参照する接続先ポインタと静的データの配信ポイントです。</p>
<ul>
<li><code>api/v1/rendezvous.json</code> — シグナリングサーバの接続先</li>
<li><code>api/v1/meta.json</code> — 最低サポートバージョンとお知らせ</li>
<li><code>api/v1/openings/index.json</code> — 定跡データ</li>
<li><code>api/v1/puzzles/index.json</code> — 課題局面</li>
</ul>
